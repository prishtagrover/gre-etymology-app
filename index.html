            "@type": "Answer",
            "text": "Learning GRE vocabulary through etymology — understanding Latin and Greek roots — is the most efficient approach. When you learn the root 'vert' means 'to turn', you instantly unlock avert, subvert, revert, perverse, aversion, and dozens more words. This app teaches all 500+ core GRE words through their root families."

        },
        {
          "@type": "Question",
          "name": "How many words do I need to know for the GRE?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most GRE prep experts recommend mastering 300–500 high-frequency words. This app covers 500+ words categorized by frequency (Cat 1 = essential, Cat 5 = rare), sourced from Manhattan 5lb, Kaplan GRE, and Magoosh flashcards."

          "@type": "Question",
          "name": "What Latin and Greek roots are most important for the GRE?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The most GRE-critical roots include: vert/vers (turn), duc/duct (lead), cred (believe), greg (flock), luc/lum (light), loqu/loc (speak), ten/tain (hold), path (feeling), chron (time), morph (form), and log (word/reason). Mastering these ~30 roots unlocks hundreds of GRE words."
          }
        }
      ]
    }
